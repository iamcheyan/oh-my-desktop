general {
    lock_cmd = sumika-lock
    before_sleep_cmd = SUMIKA_LOCK_ONLY=true sumika-lock
    after_sleep_cmd = sleep 1 && sumika-wake
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Screensaver timeout removed: calling external lockers directly conflicts with
# Quickshell's Lock {} module (both fight for ext-session-lock-v1 protocol).
# Lock is handled by sumika-lock → Quickshell LockService (listener below).

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = sumika-lock
    on-resume = sumika-wake
}
